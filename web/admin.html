<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>MACWorld — Вход в панель управления</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #000;
            font-family: 'Inter', sans-serif;
        }

        /* Единый фон с главной страницей */
        .scene {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .bg-layer {
            position: absolute;
            top: -10%; left: -10%;
            width: 120%; height: 120%;
            min-width: 120vw; min-height: 120dvh;
            object-fit: cover;
            object-position: center;
            will-change: transform;
            background: linear-gradient(135deg, rgba(216, 237, 227, 0.95) 0%, rgba(233, 239, 232, 0.95) 50%, rgba(247, 243, 233, 0.95) 100%);
        }

        #particles {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 2;
        }

        .glow {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(300px, 50vw, 600px);
            height: clamp(300px, 50vw, 600px);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 40%, transparent 70%);
            pointer-events: none; z-index: 3;
            animation: pulse 6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        .vignette {
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.2) 100%);
            pointer-events: none; z-index: 4;
        }

        /* Контейнер входа */
        .auth-container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: 90%;
            max-width: 440px;
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -45%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 32px;
            padding: 48px 40px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.15);
        }

        .auth-icon {
            width: 64px; height: 64px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px;
        }

        .auth-icon svg {
            width: 28px; height: 28px;
            stroke: #2d4a3e; stroke-width: 2;
            fill: none; stroke-linecap: round; stroke-linejoin: round;
        }

        .auth-title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(32px, 8vw, 42px);
            font-weight: 600;
            color: #2d4a3e;
            margin-bottom: 8px;
            text-shadow: 0 2px 20px rgba(255,255,255,0.5);
        }

        .auth-subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: 18px;
            font-weight: 400;
            color: #4a635d;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .input-group {
            position: relative;
            margin-bottom: 24px;
        }

        .input-group input {
            width: 100%;
            padding: 16px 52px 16px 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: #2d4a3e;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder { color: rgba(45, 74, 62, 0.5); }
        
        .input-group input:focus {
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1);
        }

        .input-group input.error {
            border-color: rgba(196, 92, 92, 0.8);
            background: rgba(196, 92, 92, 0.1);
        }

        .toggle-password {
            position: absolute;
            right: 8px; top: 50%;
            transform: translateY(-50%);
            width: 36px; height: 36px;
            border-radius: 50%;
            background: none;
            border: none;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: #4a635d;
            transition: all 0.2s;
        }
        .toggle-password:hover { background: rgba(255, 255, 255, 0.3); color: #2d4a3e; }
        .toggle-password svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        .btn-login {
            width: 100%;
            padding: 16px 32px;
            background: rgba(61, 107, 88, 0.9);
            backdrop-filter: blur(10px);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 100px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background: rgba(61, 107, 88, 1);
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
        }

        .error-message {
            display: none;
            margin-top: 16px;
            padding: 12px 16px;
            background: rgba(196, 92, 92, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(196, 92, 92, 0.3);
            border-radius: 16px;
            font-size: 14px;
            color: #6b3a3a;
            text-align: center;
        }
        .error-message.visible { display: block; animation: fadeIn 0.3s ease-out; }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 28px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 16px;
            color: #4a635d;
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover { color: #2d4a3e; }
        .back-link svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; }

        @media (max-width: 480px) {
            .auth-card { padding: 36px 24px; border-radius: 24px; }
        }
    </style>
</head>
<body>

    <div class="scene">
        <img class="bg-layer" id="bg" src="/web/images/macworld.webp" alt="Background">
        <canvas id="particles"></canvas>
        <div class="glow"></div>
        <div class="vignette"></div>

        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-icon">
                    <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </div>
                <h1 class="auth-title">Панель управления</h1>
                <p class="auth-subtitle">Введите пароль для доступа к настройкам</p>
                
                <form id="auth-form" onsubmit="return handleLogin(event)">
                    <div class="input-group">
                        <input type="password" id="admin-pass" placeholder="Пароль администратора" autocomplete="current-password">
                        <button type="button" class="toggle-password" onclick="togglePassword()" title="Показать пароль">
                            <svg id="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg id="eye-off-icon" viewBox="0 0 24 24" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                    <button type="submit" class="btn-login">Войти в систему</button>
                </form>
                
                <div class="error-message" id="error-msg">Неверный пароль. Попробуйте снова.</div>
                
                <a href="/" class="back-link">
                    <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                    Вернуться на главную
                </a>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('admin-pass');
            const eyeIcon = document.getElementById('eye-icon');
            const eyeOffIcon = document.getElementById('eye-off-icon');
            if (input.type === 'password') {
                input.type = 'text';
                eyeIcon.style.display = 'none';
                eyeOffIcon.style.display = 'block';
            } else {
                input.type = 'password';
                eyeIcon.style.display = 'block';
                eyeOffIcon.style.display = 'none';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const password = document.getElementById('admin-pass').value;
            const errorMsg = document.getElementById('error-msg');
            const input = document.getElementById('admin-pass');
            
            if (!password) {
                errorMsg.textContent = 'Введите пароль';
                errorMsg.classList.add('visible');
                input.classList.add('error');
                return false;
            }
            
            fetch('/api/admin/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    localStorage.setItem('admin_auth', 'true');
                    window.location.href = '/admin/dashboard';
                } else {
                    errorMsg.textContent = data.error || 'Неверный пароль';
                    errorMsg.classList.add('visible');
                    input.classList.add('error');
                    input.value = '';
                    input.focus();
                }
            })
            .catch(() => {
                errorMsg.textContent = 'Ошибка подключения к серверу';
                errorMsg.classList.add('visible');
            });
            return false;
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('admin-pass').focus();
            initParticles();
        });

        // Минималистичная анимация частиц (как на главной)
        function initParticles() {
            const canvas = document.getElementById('particles');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const particles = [];
            for (let i = 0; i < 60; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 1,
                    speedX: (Math.random() - 0.5) * 0.3,
                    speedY: (Math.random() - 0.5) * 0.3,
                    opacity: Math.random() * 0.5 + 0.2
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.x += p.speedX;
                    p.y += p.speedY;
                    if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`;
                    ctx.fill();
                });
                requestAnimationFrame(animate);
            }
            animate();
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        }
    </script>
</body>
</html>
