<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>MACWorld — Виртуальное пространство</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: #000;
    font-family: 'Inter', sans-serif;
  }

  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .bg-layer {
    position: absolute;
    top: -10%;
    left: -10%;
    width: 120%;
    height: 120%;
    min-width: 120vw;  
    min-height: 120dvh; 
    object-fit: cover;
    object-position: center;
    will-change: transform;
    background: linear-gradient(135deg, rgba(216, 237, 227, 0.95) 0%, rgba(233, 239, 232, 0.95) 50%, rgba(247, 243, 233, 0.95) 100%);
  }

  #particles {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 2;
  }

  .glow {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: clamp(300px, 50vw, 600px);
    height: clamp(300px, 50vw, 600px);
    border-radius: 50%;
    background: radial-gradient(circle, 
      rgba(255,255,255,0.15) 0%, 
      rgba(255,255,255,0.05) 40%, 
      transparent 70%);
    pointer-events: none;
    z-index: 3;
    animation: pulse 6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
  }

  .text-layer {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 10;
    color: #4a635d;
    pointer-events: none;
    will-change: transform;
    width: 90%;
    max-width: 800px;
  }

  .text-layer h1 {
    font-family: 'Dancing Script', cursive;
    font-weight: 600;
    font-size: clamp(3rem, 10vw, 9rem);
    letter-spacing: clamp(2px, 1vw, 6px);
    margin-bottom: 10px;
    opacity: 0;
    animation: writeIn 3s ease-out 0.5s forwards;
    text-shadow: 0 2px 30px rgba(255,255,255,0.7);
    line-height: 1;
  }

  @keyframes writeIn {
    0% { 
      opacity: 0; 
      transform: translateY(20px) rotate(-2deg);
      filter: blur(4px);
    }
    50% {
      opacity: 0.7;
      filter: blur(1px);
    }
    100% { 
      opacity: 1; 
      transform: translateY(0) rotate(0deg);
      filter: blur(0);
    }
  }

  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 15px 0;
    opacity: 0;
    animation: fadeIn 2s ease-out 2s forwards;
  }

  .divider-line {
    width: clamp(40px, 8vw, 70px);
    height: 1px;
    background: linear-gradient(90deg, transparent, #4a635d, transparent);
  }

  .divider-star {
    color: #4a635d;
    font-size: 11px;
  }

  .text-layer p {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(0.9rem, 2.5vw, 1.2rem);
    letter-spacing: clamp(1px, 0.3vw, 2px);
    line-height: 1.6;
    opacity: 0;
    animation: fadeIn 2s ease-out 2.5s forwards;
    max-width: 600px;
    margin: 0 auto;
  }

  .text-layer .tagline-main {
    font-style: italic;
    margin-bottom: 4px;
  }

  .text-layer .tagline-sub {
    letter-spacing: clamp(1px, 0.5vw, 3px);
    font-weight: 400;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .btn-primary {
    pointer-events: auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: clamp(12px, 2.5vw, 18px) clamp(24px, 6vw, 48px);
    margin-top: clamp(15px, 4vw, 40px);
    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 100px;
    color: #2d4a3e;
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(14px, 3vw, 18px);
    font-weight: 500;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    opacity: 0;
    animation: fadeIn 2s ease-out 3.5s forwards;
    touch-action: manipulation !important;
    -webkit-tap-highlight-color: transparent !important;
    user-select: none !important;
    max-width: 90vw;
    white-space: nowrap;
  }

  .btn-primary:hover {
    background: rgba(255, 255, 255, 0.35);
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
  }

  .btn-primary:active {
    transform: translateY(0);
  }

  .btn-primary:disabled {
    opacity: 0.5;
    cursor: wait;
  }

  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.15) 100%);
    pointer-events: none;
    z-index: 4;
  }

  .fullscreen-btn {
    display: none;
    position: fixed;
    top: 12px;
    right: 12px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: #2d4a3e;
    font-size: 18px;
    cursor: pointer;
    z-index: 50;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }

  .fullscreen-btn:hover {
    background: rgba(255, 255, 255, 0.4);
    transform: scale(1.1);
  }

  /* =========================================
      ДИЗАЙН МОДАЛЬНОГО ОКНА
     ========================================= */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: rgba(45, 74, 62, 0.3);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }

  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .modal {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 32px;
    padding: 48px 40px;
    max-width: 480px;
    width: 90%;
    text-align: center;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.2);
    transform: scale(0.95) translateY(10px);
    transition: transform 0.4s ease;
    position: relative;
  }

  .modal-overlay.active .modal {
    transform: scale(1) translateY(0);
  }

  .modal-close {
    position: absolute;
    top: 16px; right: 16px;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.3);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.4);
    color: #2d4a3e;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    touch-action: manipulation !important;
    -webkit-tap-highlight-color: transparent !important;
  }

  .modal-close:hover {
    background: rgba(255, 255, 255, 0.5);
  }

  .modal-title {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(26px, 6vw, 32px);
    font-weight: 600;
    color: #2d4a3e;
    margin-bottom: 12px;
    text-shadow: 0 2px 20px rgba(255,255,255,0.5);
  }

  .modal-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(14px, 3vw, 16px);
    font-weight: 300;
    color: #4a635d;
    line-height: 1.6;
    margin-bottom: 28px;
  }

  /* Поле ссылки с закругленными краями */
  .link-field {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 50px;
    padding: 8px 12px 8px 20px;
    margin-bottom: 24px;
    transition: border-color 0.2s;
  }

  .link-field:focus-within {
    border-color: rgba(255, 255, 255, 0.6);
  }

  .link-field input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: #2d4a3e;
    font-weight: 400;
    touch-action: manipulation !important;
    -webkit-tap-highlight-color: transparent !important;
    min-width: 0;
  }

  /* Круглая кнопка копирования */
  .btn-copy {
    width: 36px;
    height: 36px;
    min-width: 36px;
    border-radius: 50%;
    background: rgba(61, 107, 88, 0.8);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    touch-action: manipulation !important;
    -webkit-tap-highlight-color: transparent !important;
    position: relative;
    overflow: hidden;
  }

  .btn-copy:hover {
    background: rgba(61, 107, 88, 1);
    transform: scale(1.05);
  }

  .btn-copy.copied {
    background: rgba(107, 143, 126, 0.9);
  }

  /* Иконки внутри кнопки */
  .btn-copy svg {
    width: 18px;
    height: 18px;
    stroke: #fff;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .btn-copy .check-icon {
    display: none;
  }

  .btn-copy.copied .copy-icon {
    display: none;
  }

  .btn-copy.copied .check-icon {
    display: block;
  }

  .btn-enter {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 16px 32px;
    background: rgba(61, 107, 88, 0.9);
    backdrop-filter: blur(10px);
    color: #fff;
    border-radius: 100px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(16px, 4vw, 18px);
    font-weight: 500;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    transition: all 0.3s ease;
    letter-spacing: 1px;
    touch-action: manipulation !important;
    -webkit-tap-highlight-color: transparent !important;
  }

  .btn-enter:hover {
    background: rgba(61, 107, 88, 1);
    transform: translateY(-1px);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
  }

  .btn-enter:active {
    transform: translateY(0);
  }

  /* МОБИЛЬНЫЕ УСТРОЙСТВА - ВЕРТИКАЛЬНАЯ ОРИЕНТАЦИЯ */
  @media (max-width: 768px) and (orientation: portrait) {
    .bg-layer {
      top: -7.5%;
      left: -7.5%;
      width: 115%;
      height: 115%;
      min-width: 115vw;
      min-height: 115dvh;
      object-position: center top;
    }

    .text-layer h1 {
      font-size: 3.5rem;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .text-layer p {
      font-size: 1rem;
      letter-spacing: 1px;
      line-height: 1.5;
    }

    .divider {
      margin: 10px 0;
    }

    .divider-line {
      width: 40px;
    }

    .btn-primary {
      padding: 14px 28px;
      font-size: 16px;
      margin-top: 20px;
      width: 85vw;
      max-width: 300px;
    }

    .modal {
      padding: 36px 24px;
      border-radius: 24px;
    }

    /* ИСПРАВЛЕНИЕ: Отступ сверху, чтобы заголовок не наезжал на крестик */
    .modal-title {
      margin-top: 24px;
    }

    /* Новый дизайн поля ссылки отлично работает на мобильных без flex-wrap */
    .link-field {
      padding: 6px 10px 6px 16px;
      gap: 8px;
    }
    
    .link-field input {
      font-size: 12px;
    }
    
    .btn-copy {
      width: 32px;
      height: 32px;
      min-width: 32px;
    }
    
    .btn-copy svg {
      width: 16px;
      height: 16px;
    }
  }

  /* МОБИЛЬНЫЕ УСТРОЙСТВА - ГОРИЗОНТАЛЬНАЯ ОРИЕНТАЦИЯ */
  @media (max-width: 900px) and (orientation: landscape) {
    .fullscreen-btn {
      display: flex;
    }

    .bg-layer {
      top: -15%;
      left: -7.5%;
      width: 115%;
      height: 130%;
      min-width: 115vw;
      min-height: 130dvh;
    }

    .text-layer {
      transform: translate(-50%, -50%) scale(0.7);
    }

    .text-layer h1 {
      font-size: 5rem;
      letter-spacing: 3px;
      margin-bottom: 5px;
    }

    .text-layer p {
      font-size: 1rem;
      letter-spacing: 1.5px;
      line-height: 1.4;
    }

    .divider {
      margin: 8px 0;
    }

    .divider-line {
      width: 50px;
    }

    .btn-primary {
      padding: 10px 24px;
      font-size: 15px;
      margin-top: 12px;
    }

    .glow {
      width: 400px;
      height: 400px;
    }
  }

  /* ПЛАНШЕТЫ */
  @media (min-width: 768px) and (max-width: 1024px) {
    .text-layer h1 {
      font-size: 6rem;
    }

    .text-layer p {
      font-size: 1.1rem;
    }

    .btn-primary {
      padding: 16px 40px;
      font-size: 17px;
    }
  }
</style>
</head>
<body>

<div class="scene">
  <picture>
    <source media="(max-width: 768px) and (orientation: portrait)" srcset="/web/images/macworld-vertical.webp">
    <img 
      class="bg-layer" 
      id="bg"
      src="/web/images/macworld.webp"
      srcset="
        /web/images/macworld-small.webp 768w,
        /web/images/macworld-medium.webp 1440w,
        /web/images/macworld.webp 1920w,
        /web/images/macworld-4k.webp 3840w
      "
      sizes="100vw"
      alt="MACWorld background"
    >
  </picture>
  
  <canvas id="particles"></canvas>
  <div class="glow"></div>
  <div class="vignette"></div>

  <div class="text-layer" id="text">
    <h1>MACWorld</h1>
    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-star">✦</div>
      <div class="divider-line"></div>
    </div>
    <p>
      <span class="tagline-main">Где образы обретают смысл.</span><br>
      <span class="tagline-sub">Смотри. Чувствуй. Осознавай.</span>
    </p>
    <button class="btn-primary" id="create-session-btn">Создать сессию</button>
  </div>
</div>

<!-- ОБНОВЛЕННОЕ МОДАЛЬНОЕ ОКНО -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <button class="modal-close" id="modal-close" title="Закрыть">✕</button>
    <h2 class="modal-title">Новая сессия готова</h2>
    <p class="modal-text">
      Скопируйте ссылку, чтобы поделиться сессией,<br>или сразу откройте виртуальный стол.
    </p>
    <div class="link-field">
      <input type="text" id="session-link" readonly>
      <button class="btn-copy" id="btn-copy" title="Копировать ссылку">
        <!-- Иконка копирования -->
        <svg class="copy-icon" viewBox="0 0 24 24">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <!-- Иконка галочки (появляется после копирования) -->
        <svg class="check-icon" viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>
    </div>
    <button class="btn-enter" id="btn-enter">Войти в сессию</button>
  </div>
</div>

<script>
  let currentSessionId = '';

  async function checkSiteBlock() {
    try {
      const res = await fetch('/api/decks');
      if (!res.ok && res.status === 503) {
        const data = await res.json();
        if (data.error === 'site_blocked') {
          const overlay = document.createElement('div');
          overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:99999;display:flex;justify-content:center;align-items:center;color:white;font-family:sans-serif;text-align:center;padding:20px;';
          overlay.innerHTML = `<div style="max-width:500px;"><h1 style="font-size:24px;margin-bottom:20px;">🔒 Доступ заблокирован</h1><p style="font-size:18px;line-height:1.5;">${data.message}</p><p style="margin-top:30px;color:#aaa;font-size:14px;">Для разблокировки обращайтесь к администратору.</p></div>`;
          document.body.appendChild(overlay);
          document.body.style.overflow = 'hidden';
          return true;
        }
      }
    } catch (err) { console.log("Проверка статуса блокировки..."); }
    return false;
  }

  document.getElementById('create-session-btn').addEventListener('click', async () => {
    const btn = document.getElementById('create-session-btn');
    const originalText = btn.textContent;
    btn.textContent = '⏳ Создание...';
    btn.disabled = true;

    try {
      const response = await fetch('/api/sessions', { method: 'POST' });
      if (!response.ok) throw new Error('Ошибка сервера');
      
      const data = await response.json();
      currentSessionId = data.id;
      
      const link = window.location.origin + '/table/' + currentSessionId;
      document.getElementById('session-link').value = link;
      document.getElementById('modal-overlay').classList.add('active');
    } catch (err) {
      alert('Не удалось создать сессию: ' + err.message);
    } finally {
      btn.textContent = originalText;
      btn.disabled = false;
    }
  });

  document.getElementById('modal-close').addEventListener('click', () => {
    document.getElementById('modal-overlay').classList.remove('active');
  });

  document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if (e.target.id === 'modal-overlay') {
      document.getElementById('modal-overlay').classList.remove('active');
    }
  });

  // ОБНОВЛЕННАЯ ЛОГИКА КОПИРОВАНИЯ (переключает иконки вместо текста)
  document.getElementById('btn-copy').addEventListener('click', async () => {
    const input = document.getElementById('session-link');
    const btn = document.getElementById('btn-copy');
    try {
      await navigator.clipboard.writeText(input.value);
      btn.classList.add('copied');
      setTimeout(() => { btn.classList.remove('copied'); }, 2000);
    } catch (err) {
      input.select();
      document.execCommand('copy');
      btn.classList.add('copied');
      setTimeout(() => { btn.classList.remove('copied'); }, 2000);
    }
  });

  document.getElementById('btn-enter').addEventListener('click', () => {
    if (currentSessionId) {
      localStorage.setItem('last_session', currentSessionId);
      window.location.href = '/table/' + currentSessionId;
    }
  });

  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  
  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  class Particle {
    constructor() { this.reset(); }
    reset() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.size = Math.random() * 3 + 1;
      this.speedX = (Math.random() - 0.5) * 0.3;
      this.speedY = (Math.random() - 0.5) * 0.3;
      this.opacity = Math.random() * 0.6 + 0.2;
      this.fadeSpeed = Math.random() * 0.01 + 0.005;
      this.fadeDirection = 1;
    }
    update() {
      this.x += this.speedX;
      this.y += this.speedY;
      this.opacity += this.fadeSpeed * this.fadeDirection;
      if (this.opacity >= 0.8) this.fadeDirection = -1;
      if (this.opacity <= 0.1) this.fadeDirection = 1;
      if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
      ctx.shadowBlur = 10;
      ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
      ctx.fill();
    }
  }

  const particles = [];
  for (let i = 0; i < 80; i++) particles.push(new Particle());

  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animateParticles);
  }
  animateParticles();

  const bg = document.getElementById('bg');
  const text = document.getElementById('text');
  let time = 0;

  function autoMove() {
    time += 0.008;

    const bgX = Math.sin(time) * 12 + Math.sin(time * 0.7) * 6;
    const bgY = Math.cos(time * 0.8) * 10 + Math.cos(time * 0.5) * 5;
    bg.style.transform = `translate(${bgX}px, ${bgY}px)`;

    const textX = Math.sin(time * 1.2 + 1) * 6;
    const textY = Math.cos(time * 0.9 + 1) * 5;
    text.style.transform = `translate(calc(-50% + ${textX}px), calc(-50% + ${textY}px))`;

    requestAnimationFrame(autoMove);
  }
  autoMove();

  document.addEventListener('DOMContentLoaded', () => {
    checkSiteBlock();
  });

  const bgImg = document.getElementById('bg');
  if (bgImg) {
    bgImg.onerror = () => {
      bgImg.style.display = 'none';
      console.log('Фон не загрузился, используем CSS градиент');
    };
  }

  // ЛОГИКА ПОЛНОЭКРАННОГО РЕЖИМА ДЛЯ МОБИЛЬНЫХ
  const fullscreenBtn = document.createElement('button');
  fullscreenBtn.className = 'fullscreen-btn';
  fullscreenBtn.innerHTML = '⛶';
  fullscreenBtn.title = 'На весь экран';
  document.body.appendChild(fullscreenBtn);

  fullscreenBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log(`Ошибка полноэкранного режима: ${err.message}`);
      });
    } else {
      document.exitFullscreen();
    }
  });

  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) {
      fullscreenBtn.innerHTML = '⛶';
    }
  });
</script>

</body>
</html>
